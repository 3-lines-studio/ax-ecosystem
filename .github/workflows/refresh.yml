name: refresh

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
  push:
    paths: ["catalog.json"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_catalog.py

      - name: Commit if changed
        run: |
          git config user.name "ax-ecosystem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md versions.json
          if git diff --cached --quiet; then
            echo "catalog is up to date"
          else
            git commit -m "refresh: update catalog versions"
            git push
            echo "pushed updated catalog"
          fi
